services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - bot-data:/app/data
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 15s
    mem_limit: 256m
volumes:
  bot-data: